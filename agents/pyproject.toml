[project]
name = "protocol-fold-agents"
version = "0.1.0"
description = "AG2-based plan-generation agents for Protocol Fold (FastAPI sidecar to the Next.js app)."
requires-python = ">=3.10,<3.14"
dependencies = [
  "ag2[gemini]>=0.7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
